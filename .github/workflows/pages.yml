# Publish nepem.org with only the site's own files.
#
# Pages used to publish the whole branch, so the knowledge base, QUESTIONS_for_Ed.md,
# CLAUDE.md, the Python files and index.npz could all be downloaded from nepem.org.
# This copies an explicit list into _site and publishes that alone. Nothing in the
# repo moves: Render still reads knowledge_base/ and index.npz where they are.
#
# Needs Settings -> Pages -> Source: "GitHub Actions". A file the site needs that is
# not listed here is not served. Add it below.
name: Publish nepem.org

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as GitHub's own Pages template has it. With upload and deploy in one job,
  # the deploy step three times on 24 November 2026 could not find the upload made a
  # moment before ("No artifacts named github-pages"), and the site stayed as it was.
  # A job boundary means the upload is finished and registered before deploy asks for it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Copy only the site's own files
        run: |
          set -euo pipefail
          mkdir _site
          # Required: a missing one stops the publish, so the site is never
          # replaced by a version without it.
          cp index.html games.html say.js audio_words.json CNAME ed-portrait.jpg _site/
          cp -r audio _site/audio
          test -f _site/audio/manifest.json
          # The browser icons and the social preview card, at the paths the
          # pages name. Only these: the rest of brand/ is source files.
          mkdir -p _site/brand/web-and-social
          for f in favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png nepem-og-social-card.png; do
            cp "brand/web-and-social/$f" _site/brand/web-and-social/
          done
          # The pictures: the web copies only (the originals in scenes/ are sources), and
          # each scene's word layout, built now from the sources. build_scenes.py leaves
          # out any word Ed has not confirmed and names it in this log.
          mkdir -p _site/scenes/web
          cp scenes/web/*.webp _site/scenes/web/
          python3 build_scenes.py words _site/scenes
          for f in animals head body; do test -f _site/scenes/$f.json; done
          # Browsers also ask for /favicon.ico on their own, whatever the page says.
          cp brand/web-and-social/favicon.ico _site/favicon.ico
          echo "Publishing:"; find _site -maxdepth 1 | sort; echo "audio files: $(ls _site/audio | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url || steps.retry3.outputs.page_url }}
    steps:
      # GitHub's deployment API sometimes answers "Failed to create deployment
      # (status: 500)" for a few minutes. That is GitHub's server, not this workflow, so
      # wait and ask again: three retries, after 1, 2 and 4 minutes. The last one is not
      # allowed to fail quietly, so a site that did not update is never green.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: retry1
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 120
      - id: retry2
        if: steps.deploy.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure' && steps.retry1.outcome == 'failure' && steps.retry2.outcome == 'failure'
        run: sleep 240
      - id: retry3
        if: steps.deploy.outcome == 'failure' && steps.retry1.outcome == 'failure' && steps.retry2.outcome == 'failure'
        uses: actions/deploy-pages@v4
